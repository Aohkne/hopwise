name: verify-data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/verify-data.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_data.py
